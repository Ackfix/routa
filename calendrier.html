<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTA · Calendrier</title>
<meta name="theme-color" content="#0E1116">
<style>
  :root { --bg: #0E1116; --surface: #1B212B; --fg: #F4F6FA; --muted: #9AA4B2; --accent: #FF8A3D; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: max(20px, env(safe-area-inset-top)) 16px 32px; }
  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 22px; margin: 4px 0 0; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  .card { background: var(--surface); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .card b { display: block; }
  .card span { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; min-width: 0; }
  a.btn { display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 14px; background: var(--accent); color: #0E1116; font-weight: 700; text-decoration: none; padding: 10px 16px; text-align: center; }
  a.btn.soft { background: var(--surface); color: var(--fg); font-weight: 600; }
  a.small { font-size: 13px; color: #4DA3FF; text-decoration: none; white-space: nowrap; }
</style>
</head>
<body>
<main id="m"></main>
<script>
(function () {
  var TX = {
    fr: ['Ajouter au calendrier', 'Touche le bouton : ton téléphone propose de l\'ajouter à ton calendrier. Un rappel est prévu la veille à 9 h.', 'Ajouter à mon calendrier', 'Google Agenda', 'Retour à ROUTA', 'Rien à ajouter.', 'Rappel ROUTA'],
    en: ['Add to calendar', 'Tap the button: your phone offers to add it to your calendar. A reminder is set for the day before at 9 am.', 'Add to my calendar', 'Google Calendar', 'Back to ROUTA', 'Nothing to add.', 'ROUTA reminder'],
    de: ['Zum Kalender hinzufügen', 'Tippe auf die Taste: dein Telefon bietet an, es deinem Kalender hinzuzufügen. Eine Erinnerung kommt am Vortag um 9 Uhr.', 'Zu meinem Kalender hinzufügen', 'Google Kalender', 'Zurück zu ROUTA', 'Nichts hinzuzufügen.', 'ROUTA-Erinnerung'],
    it: ['Aggiungi al calendario', 'Tocca il pulsante: il telefono propone di aggiungerlo al calendario. Un promemoria è previsto il giorno prima alle 9.', 'Aggiungi al mio calendario', 'Google Calendar', 'Torna a ROUTA', 'Niente da aggiungere.', 'Promemoria ROUTA'],
    pt: ['Adicionar ao calendário', 'Toca no botão: o telemóvel propõe adicioná-lo ao calendário. Um lembrete fica marcado para a véspera às 9 h.', 'Adicionar ao meu calendário', 'Google Calendar', 'Voltar ao ROUTA', 'Nada a adicionar.', 'Lembrete ROUTA'],
    es: ['Añadir al calendario', 'Toca el botón: el teléfono te propone añadirlo a tu calendario. Hay un aviso el día anterior a las 9.', 'Añadir a mi calendario', 'Google Calendar', 'Volver a ROUTA', 'Nada que añadir.', 'Recordatorio ROUTA'],
    tr: ['Takvime ekle', 'Düğmeye dokun: telefonun takvimine eklemeyi önerir. Bir gün önce saat 9\'da hatırlatma vardır.', 'Takvimime ekle', 'Google Takvim', 'ROUTA\'ya dön', 'Eklenecek bir şey yok.', 'ROUTA hatırlatması'],
    sq: ['Shto në kalendar', 'Prek butonin: telefoni të propozon ta shtosh në kalendar. Një kujtesë është caktuar një ditë më parë në orën 9.', 'Shto në kalendarin tim', 'Google Calendar', 'Kthehu te ROUTA', 'Asgjë për të shtuar.', 'Kujtesë ROUTA'],
    sr: ['Dodaj u kalendar', 'Dodirni dugme: telefon nudi da ga doda u kalendar. Podsetnik je dan ranije u 9 časova.', 'Dodaj u moj kalendar', 'Google kalendar', 'Nazad na ROUTA', 'Nema šta da se doda.', 'ROUTA podsetnik']
  };
  var m = document.getElementById('m');
  var data = { l: 'fr', e: [] };
  try { var h = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/'); data = JSON.parse(decodeURIComponent(escape(atob(h)))); } catch (e) { /* */ }
  var t = TX[data.l] || TX.fr;
  document.documentElement.lang = data.l || 'fr';
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ev = (data.e || []).filter(function (x) { return x && x.t && /^\d{4}-\d{2}-\d{2}$/.test(x.d || ''); });
  if (!ev.length) { m.innerHTML = '<h1>' + esc(t[0]) + '</h1><p>' + esc(t[5]) + '</p>'; return; }
  var d8 = function (d) { return d.replace(/-/g, ''); };
  var next = function (d) { var x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + 1); return x.toISOString().slice(0, 10).replace(/-/g, ''); };
  var clean = function (s) { return String(s).replace(/[\\,;]/g, ' ').replace(/\n/g, ' '); };
  var now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ROUTA//Rappels//FR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  ev.forEach(function (x, i) {
    lines.push('BEGIN:VEVENT', 'UID:' + d8(x.d) + '-' + i + '-' + Math.random().toString(36).slice(2) + '@routa', 'DTSTAMP:' + now, 'DTSTART;VALUE=DATE:' + d8(x.d), 'DTEND;VALUE=DATE:' + next(x.d),
      'SUMMARY:' + clean(x.t), 'DESCRIPTION:' + clean(t[6]), 'BEGIN:VALARM', 'TRIGGER:-PT15H', 'ACTION:DISPLAY', 'DESCRIPTION:' + clean(x.t), 'END:VALARM', 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  var ics = lines.join('\r\n');
  var href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  var g = function (x) { return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(x.t) + '&dates=' + d8(x.d) + '/' + next(x.d) + '&details=' + encodeURIComponent(t[6]); };
  var fmt = function (d) { try { return new Date(d + 'T12:00:00').toLocaleDateString(data.l === 'sr' ? 'sr-Latn' : (data.l || 'fr'), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return d; } };
  m.innerHTML = '<h1>' + esc(t[0]) + '</h1><p>' + esc(t[1]) + '</p>' +
    ev.map(function (x) { return '<div class="card"><div class="grow"><b>' + esc(x.t) + '</b><span>' + esc(fmt(x.d)) + '</span></div><a class="small" href="' + esc(g(x)) + '" target="_blank" rel="noopener">' + esc(t[3]) + '</a></div>'; }).join('') +
    '<a class="btn" id="add" href="' + esc(href) + '"' + (/iPhone|iPad|Macintosh/.test(navigator.userAgent) ? '' : ' download="routa-rappels.ics"') + '>' + esc(t[2]) + '</a>' +
    '<a class="btn soft" href="https://routa.ackfix.com/">' + esc(t[4]) + '</a>';
})();
</script>
</body>
</html>
