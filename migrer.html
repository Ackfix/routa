<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROUTA</title>
<style>html,body{margin:0;height:100%;background:#0E1116}</style></head><body>
<script>/* ROUTA – passage à l'app avec fichiers embarqués : on transmet le profil enregistré par l'ancienne version (même téléphone, même app). */
(function(){
  if (!/[?&]from=app\b/.test(location.search)) { location.replace('./'); return; }
  var out = {};
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (!/^routa\./.test(k) || k === 'routa.trace') continue; var v = localStorage.getItem(k); if (v != null && v.length < 200000) out[k] = v; } } catch (e) {}
  location.replace('capacitor://routa.ackfix.com/index.html#mig=' + encodeURIComponent(JSON.stringify(out)));
})();
</script></body></html>
