<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ROUTA · Statistiques</title>
<style>
:root{--bg:#0E1116;--card:#171B22;--line:#262C36;--ink:#F2F4F7;--muted:#9AA3AF;--accent:#FF8A3D;--ok:#3DD68C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 10px;color:var(--muted);font-weight:600}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}.l{color:var(--muted);font-size:13px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:92px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--accent)}
.zone{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.zone a{color:var(--ink)}
form{display:flex;gap:8px;margin-top:14px}
input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font-size:16px}
button{height:46px;border-radius:12px;border:0;background:var(--accent);color:#1A1205;font-weight:700;padding:0 16px;font-size:15px}
.err{color:#FF8F94;margin-top:10px}

.tabs{display:flex;gap:8px;margin:14px 0 4px}
.tabs button{flex:1;height:42px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--accent);color:#1A1205;border-color:var(--accent)}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.flt button{height:34px;font-size:13px;padding:0 12px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.flt button.on{background:var(--accent);color:#1A1205;border-color:var(--accent)}
.fb{padding:10px 12px;margin-bottom:8px;cursor:pointer}
.fb .t{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.fb .m{margin-top:4px;font-size:14px;line-height:1.35;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fb.open .m{display:block}
.fb .x{display:none;margin-top:6px;font-size:12px;color:var(--muted)}
.fb.open .x{display:block}
.tag{font-weight:700}
.chart{display:flex;align-items:flex-end;gap:3px;height:96px}.chart i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-width:2px}
.chartl{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px;margin:18px 0}.acts button{flex:1}.acts .alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.chip{height:36px;font-size:13px;padding:0 12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px}.chip.on{background:var(--accent);color:#1A1205;border-color:var(--accent)}
.stov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.stbox{background:var(--bg);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));width:min(100%,560px);max-height:92vh;overflow:auto}
.sthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}.sthead .x{width:40px;height:40px;background:var(--card);color:var(--ink);border-radius:50%;padding:0}
</style>
</head>
<body>
<main>
<h1>ROUTA · Statistiques</h1>
<div class="muted">Totaux seulement, aucune donnée personnelle. Page privée, non référencée.</div>
<div id="out"></div>
</main>
<script src="config.js"></script>
<script>
(function () {
  var CFG = window.ROUTA_CONFIG || {};
  var out = document.getElementById('out');
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function getKey() { try { return localStorage.getItem('routa.statsKey') || ''; } catch (e) { return ''; } }
  function setKey(k) { try { if (k) localStorage.setItem('routa.statsKey', k); else localStorage.removeItem('routa.statsKey'); } catch (e) { /* */ } }
  function ask(msg) {
    out.innerHTML = '<form id="f"><input id="k" placeholder="Code d\'accès" autocomplete="off" autocapitalize="characters"><button>Voir</button></form>' + (msg ? '<div class="err">' + esc(msg) + '</div>' : '');
    document.getElementById('f').onsubmit = function (e) { e.preventDefault(); var k = document.getElementById('k').value.trim().toUpperCase(); setKey(k); load(); };
  }
  function card(v, l) { return '<div class="card"><div class="v">' + esc(v) + '</div><div class="l">' + esc(l) + '</div></div>'; }
  var NOMI = 'https://nominatim.openstreetmap.org';
  function cget() { try { return JSON.parse(localStorage.getItem('routa.statsPlaces') || '{}'); } catch (e) { return {}; } }
  function cset(c) { try { localStorage.setItem('routa.statsPlaces', JSON.stringify(c)); } catch (e) { /* */ } }
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  async function where(z, cache) {
    var key = z.lat + ',' + z.lon;
    if (cache[key]) return cache[key];
    try {
      var r = await fetch(NOMI + '/reverse?format=jsonv2&zoom=10&accept-language=fr&lat=' + z.lat + '&lon=' + z.lon);
      var j = await r.json(); var a = (j && j.address) || {};
      var v = { pays: a.country || 'Inconnu', ville: a.city || a.town || a.village || a.municipality || a.county || a.state || 'Autre' };
      cache[key] = v; cset(cache); await wait(1100); return v;
    } catch (e) { return { pays: 'Inconnu', ville: 'Autre' }; }
  }
  function draw(zs, cache) {
    var box = document.getElementById('zn'); if (!box) return;
    var P = {};
    zs.forEach(function (z) { var v = cache[z.lat + ',' + z.lon]; if (!v) return; var p = P[v.pays] || (P[v.pays] = { n: 0, v: {} }); p.n += z.n; p.v[v.ville] = (p.v[v.ville] || 0) + z.n; });
    var names = Object.keys(P).sort(function (a, b) { return P[b].n - P[a].n; });
    COUNTRIES = names.map(function (n) { return [n, P[n].n]; });
    if (!names.length) { box.innerHTML = '<span class="muted">Pas encore de données.</span>'; return; }
    box.innerHTML = names.map(function (n) {
      return '<div class="zone"><b>' + esc(n) + '</b><b>' + esc(P[n].n) + '</b></div>';
    }).join('');
  }
  async function places(zs) {
    var cache = cget(); draw(zs, cache);
    for (var i = 0; i < zs.length; i++) { if (!cache[zs[i].lat + ',' + zs[i].lon]) { await where(zs[i], cache); draw(zs, cache); } }
    draw(zs, cache);
  }
  var ATL = { trou: 'Trou', objet: 'Objet', accident: 'Accident', travaux: 'Travaux', bouchon: 'Bouchon', arret: 'Véhicule arrêté', glissant: 'Route glissante', animal: 'Animal', feu: 'Feu hors service', contresens: 'Contresens', brouillard: 'Brouillard', fermee: 'Route fermée' };
  var KIND = { bug: ['Problème', '#FF8F94'], idee: ['Idée', '#3DD68C'], autre: ['Autre', '#9AA3AF'] };
  function fdate(t) { try { return new Date(t).toLocaleString('fr-CH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function tabs() {
    var t1 = document.getElementById('t1'), t2 = document.getElementById('t2'), p1 = document.getElementById('p1'), p2 = document.getElementById('p2'), done = false;
    t1.onclick = function () { t1.className = 'on'; t2.className = ''; p1.hidden = false; p2.hidden = true; };
    t2.onclick = function () { t2.className = 'on'; t1.className = ''; p1.hidden = true; p2.hidden = false; if (!done) { done = true; retours(p2); } };
  }
  async function retours(box) {
    box.innerHTML = '<p class="muted">Chargement…</p>';
    var list = [];
    try {
      var r = await fetch(CFG.supabaseUrl + '/rest/v1/rpc/routa_retours', { method: 'POST', headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ k: getKey() }) });
      if (r.status === 404) { box.innerHTML = '<p class="err">La lecture des avis n\'est pas encore activée dans Supabase (script 07 à lancer).</p>'; return; }
      list = await r.json(); if (!Array.isArray(list)) throw 0;
    } catch (e) { box.innerHTML = '<p class="err">Avis inaccessibles. Réessaie.</p>'; return; }
    var f = 'all', n = 25;
    function show() {
      var L = list.filter(function (x) { return f === 'all' || x.kind === f; });
      var cnt = function (k) { return list.filter(function (x) { return k === 'all' || x.kind === k; }).length; };
      box.innerHTML = '<div class="flt">' + [['all', 'Tous'], ['bug', 'Problèmes'], ['idee', 'Idées'], ['autre', 'Autre']].map(function (c) { return '<button data-f="' + c[0] + '" class="' + (c[0] === f ? 'on' : '') + '">' + c[1] + ' ' + cnt(c[0]) + '</button>'; }).join('') + '</div>' +
        (L.length ? L.slice(0, n).map(function (x) {
          var k = KIND[x.kind] || KIND.autre;
          return '<div class="card fb"><div class="t"><span><span class="tag" style="color:' + k[1] + '">' + k[0] + '</span> · ' + esc(x.pseudo || 'Anonyme') + '</span><span>' + esc(fdate(x.created_at)) + '</span></div><div class="m">' + esc(x.message || '') + '</div><div class="x">' + esc([x.app_version && ('Version ' + x.app_version), x.page && ('Écran : ' + x.page), (x.device && x.device.charAt(0) === '{') ? (function () { try { const j = JSON.parse(x.device); return (j.info || '') + ' · trajet joint (' + ((j.trace || []).length) + ' points GPS)'; } catch (e) { return 'trajet joint'; } })() : x.device].filter(Boolean).join(' · ') || 'Pas d\'infos techniques') + '</div></div>';
        }).join('') : '<p class="muted">Aucun avis pour l\'instant.</p>') +
        (L.length > n ? '<p><button id="more">Voir plus (' + (L.length - n) + ')</button></p>' : '');
      Array.prototype.forEach.call(box.querySelectorAll('.flt button'), function (b) { b.onclick = function () { f = b.getAttribute('data-f'); n = 25; show(); }; });
      Array.prototype.forEach.call(box.querySelectorAll('.fb'), function (c) { c.onclick = function () { c.classList.toggle('open'); }; });
      var mo = document.getElementById('more'); if (mo) mo.onclick = function () { n += 25; show(); };
    }
    show();
  }
  /* ---------- périodes ---------- */
  var PERIODS = [['24 h', 24, 'dernières 24 heures'], ['7 jours', 168, '7 derniers jours'], ['30 jours', 720, '30 derniers jours'], ['90 jours', 2160, '90 derniers jours'], ['Tout', 200000, 'depuis le début']];
  var TYPES = { trou: 'Trou', objet: 'Objet', accident: 'Accident', travaux: 'Travaux', bouchon: 'Bouchon', arret: 'Véhicule arrêté', glissant: 'Route glissante', animal: 'Animal', feu: 'Feu hors service', contresens: 'Contresens', brouillard: 'Brouillard', fermee: 'Route fermée' };
  var perH = 168; try { perH = +localStorage.getItem('routa.statsPer') || 168; } catch (e) { /* */ }
  var D = null, COUNTRIES = [];
  var ALLP = function () { return PERIODS.filter(function (p) { return p[1] === perH; })[0] || PERIODS[1]; };
  async function rpc(name, body) { return fetch(CFG.supabaseUrl + '/rest/v1/rpc/' + name, { method: 'POST', headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
  async function fetchStats(k, h) {
    var r = await rpc('routa_stats_p', { k: k, h: h });
    if (r.status === 404) {
      var r2 = await rpc('routa_stats', { k: k });
      if (r2.status === 404) return { missing: true };
      var o = await r2.json(); if (!o || o.code || o.message) return o;
      var f = h <= 24 ? '24h' : h <= 168 ? '7j' : '30j';
      return { fallback: true, h: h, profils: o.profils, actifs: o['actifs_' + f], alertes: o['alertes_' + f] != null ? o['alertes_' + f] : o.alertes_7j, alertes_types: o.alertes_types || [], avis: null, avis_total: o.retours, messages: o.messages_7j, spots: o.spots, spots_membres: o.spots_membres, convois: o.convois, serie_alertes: [], serie_actifs: (o.par_jour || []).map(function (x) { return { t: x.j, n: x.n }; }), zones: o.zones || [] };
    }
    return r.json();
  }
  /* graphique en barres : au plus 40 barres (regroupées si la période est longue) */
  function chart(series) {
    if (!series || !series.length) return '<span class="muted">Pas encore de données.</span>';
    var g = Math.ceil(series.length / 40), S2 = [];
    for (var i = 0; i < series.length; i += g) { var n = 0; for (var j = i; j < Math.min(series.length, i + g); j++) n += series[j].n; S2.push({ t: series[i].t, n: n }); }
    var mx = Math.max.apply(null, S2.map(function (x) { return x.n; }).concat([1]));
    var lab = function (t) { return t.length > 5 ? t.slice(5).split('-').reverse().join('.') : t; };
    return '<div class="chart">' + S2.map(function (x) { return '<i title="' + esc(lab(x.t) + ' : ' + x.n) + '" style="height:' + Math.max(3, Math.round(x.n / mx * 100)) + '%"></i>'; }).join('') + '</div><div class="chartl"><span>' + esc(lab(S2[0].t)) + '</span><span>max ' + mx + '</span><span>' + esc(lab(S2[S2.length - 1].t)) + '</span></div>';
  }
  function view() {
    var d = D, pl = ALLP();
    var chips = '<div class="flt" id="per">' + PERIODS.map(function (p) { return '<button data-h="' + p[1] + '" class="' + (p[1] === perH ? 'on' : '') + '">' + esc(p[0]) + '</button>'; }).join('') + '</div>';
    var types = (d.alertes_types || []);
    var tot = types.reduce(function (a, x) { return a + x.n; }, 0) || 1;
    var html = chips +
      '<h2>Conducteurs</h2><div class="grid">' + card(d.actifs, 'actifs · ' + pl[2]) + card(d.profils, 'profils créés (total)') + '</div>' +
      '<h2>Signalements</h2><div class="grid">' + card(d.alertes, 'signalements · ' + pl[2]) + (d.avis != null ? card(d.avis, 'avis · ' + pl[2]) : '') + '</div>' +
      '<div class="card" style="margin-top:8px">' + (types.length ? types.map(function (x) { return '<div class="bar"><span>' + esc(TYPES[x.t] || x.t) + '</span><i style="width:' + Math.max(4, Math.round(x.n / tot * 100)) + '%"></i><b>' + esc(x.n) + '</b></div>'; }).join('') : '<span class="muted">Aucun signalement sur cette période.</span>') + '</div>' +
      (d.serie_actifs && d.serie_actifs.length ? '<h2>Dernière activité des conducteurs</h2><div class="card">' + chart(d.serie_actifs) + '</div>' : '') +
      (d.serie_alertes && d.serie_alertes.length ? '<h2>Signalements dans le temps</h2><div class="card">' + chart(d.serie_alertes) + '</div>' : '') +
      '<h2>Communauté</h2><div class="grid">' + card(d.spots, 'spots (total)') + card(d.convois, 'convois (total)') + (d.messages != null ? card(d.messages, 'messages · ' + pl[2]) : '') + '</div>' +
      '<h2>Pays les plus actifs · ' + esc(pl[2]) + '</h2><div class="card" id="zn"><span class="muted">Chargement…</span></div>' +
      '<p class="muted">Pays déduits de la zone d\'activité des conducteurs, jamais de position exacte.</p>' +
      (d.fallback ? '<p class="muted">Pour toutes les périodes et les graphiques, lance le script 09 dans Supabase (SQL Editor).</p>' : '') +
      '<div class="acts"><button id="rf">Actualiser</button><button id="sh" class="alt">Partager en story</button></div>';
    document.getElementById('p1').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('#per button'), function (b) { b.onclick = function () { perH = +b.getAttribute('data-h'); try { localStorage.setItem('routa.statsPer', String(perH)); } catch (e) { /* */ } load(true); }; });
    document.getElementById('rf').onclick = function () { load(true); };
    document.getElementById('sh').onclick = openStory;
    places(d.zones || []);
  }
  async function load(keepTab) {
    var k = getKey(); if (!k) { ask(''); return; }
    if (!keepTab || !document.getElementById('p1')) out.innerHTML = '<p class="muted">Chargement…</p>';
    else document.getElementById('p1').style.opacity = '.5';
    try {
      var d = await fetchStats(k, perH);
      if (d && d.missing) { out.innerHTML = '<p class="err">Les statistiques ne sont pas encore activées dans Supabase.</p>'; return; }
      if (!d || d.code || d.message) { setKey(''); ask('Code incorrect.'); return; }
      D = d;
      var av = d.avis_total != null ? d.avis_total : (d.retours || 0);
      if (!document.getElementById('p1')) {
        out.innerHTML = '<div class="tabs"><button id="t1" class="on">Résumé</button><button id="t2">Avis (' + esc(av) + ')</button></div><div id="p1"></div><div id="p2" hidden></div>';
        tabs();
      } else { document.getElementById('t2').textContent = 'Avis (' + av + ')'; document.getElementById('p1').style.opacity = ''; }
      view();
    } catch (e) { out.innerHTML = '<p class="err">Connexion impossible. Réessaie.</p>'; }
  }

  /* ---------- story 1080 × 1920 ---------- */
  var SKS = [['avis', 'Avis', 1, function (d) { return d.avis; }], ['profils', 'Profils créés', 1, function (d) { return d.profils; }], ['alertes', 'Signalements', 1, function (d) { return d.alertes; }], ['spots', 'Spots', 0, function (d) { return d.spots; }], ['convois', 'Convois', 0, function (d) { return d.convois; }], ['messages', 'Messages', 0, function (d) { return d.messages; }]];
  var SBL = [['chart', 'Graphique d\'activité', 1], ['types', 'Types de signalements', 0], ['pays', 'Pays', 1]];
  var SCF = { style: 'dark' }; SKS.forEach(function (x) { SCF[x[0]] = !!x[2]; }); SBL.forEach(function (x) { SCF[x[0]] = !!x[2]; });
  try { var sv = JSON.parse(localStorage.getItem('routa.statsStory') || '{}'); for (var kk in sv) SCF[kk] = sv[kk]; } catch (e) { /* */ }
  var SPAL = {
    dark: { bg: '#0E1116', glow: 'rgba(255,138,61,.30)', ink: '#F4F6FA', muted: '#9AA3AF', card: '#171B22', line: 'rgba(255,255,255,.07)', bar: '#FF8A3D' },
    light: { bg: '#F5F6F8', glow: 'rgba(255,138,61,.20)', ink: '#0E1116', muted: '#5B6472', card: '#FFFFFF', line: 'rgba(14,17,22,.08)', bar: '#E8711F' },
    orange: { bg: '#FF9A4A', bg2: '#FF5F1F', glow: 'rgba(255,224,150,.5)', ink: '#1A1205', muted: 'rgba(26,18,5,.62)', card: 'rgba(255,255,255,.24)', line: 'rgba(255,255,255,.32)', bar: '#1A1205' }
  };
  var FONT = 'Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function loadImg(src) { return new Promise(function (res) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = function () { res(null); }; i.src = src; }); }
  async function drawStory() {
    var W = 1080, H = 1920, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var c = cv.getContext('2d'), K = SPAL[SCF.style] || SPAL.dark, d = D, pl = ALLP();
    if (K.bg2) { var lg = c.createLinearGradient(0, 0, W, H); lg.addColorStop(0, K.bg); lg.addColorStop(1, K.bg2); c.fillStyle = lg; } else c.fillStyle = K.bg;
    c.fillRect(0, 0, W, H);
    var g = c.createRadialGradient(W / 2, 560, 40, W / 2, 560, 880); g.addColorStop(0, K.glow); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    var cards = SKS.filter(function (x) { return SCF[x[0]] && x[3](d) != null; });
    var rows = Math.ceil(cards.length / 2), gap = 26;
    var blocks = SBL.filter(function (x) { return SCF[x[0]]; }).map(function (x) {
      if (x[0] === 'chart') return (d.serie_actifs && d.serie_actifs.length) ? { k: 'chart', h: 330 } : null;
      if (x[0] === 'types') return (d.alertes_types && d.alertes_types.length) ? { k: 'types', h: 110 + Math.min(3, d.alertes_types.length) * 66 } : null;
      return COUNTRIES.length ? { k: 'pays', h: 110 + Math.min(3, COUNTRIES.length) * 66 } : null;
    }).filter(Boolean);
    var avail = 1690 - 700, ch = 170, need = function () { return (rows ? rows * ch + (rows - 1) * gap + gap : 0) + blocks.reduce(function (a, b) { return a + b.h + gap; }, 0); };
    var f = Math.min(1, avail / Math.max(1, need())); ch = Math.round(ch * Math.max(0.7, f));
    var bh = blocks.map(function (b) { return Math.round(b.h * Math.max(0.7, f)); });
    var total = need(); var shift = Math.max(0, Math.min(150, Math.round((avail - total) / 2 - 20)));
    c.save(); c.translate(0, shift);
    c.fillStyle = K.bar; c.font = '800 36px ' + FONT; c.fillText('R O U T A  ·  S T A T S', W / 2, 200);
