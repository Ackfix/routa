<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ROUTA · Statistiques</title>
<style>
:root{--bg:#0E1116;--card:#171B22;--line:#262C36;--ink:#F2F4F7;--muted:#9AA3AF;--accent:#FF8A3D;--ok:#3DD68C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 10px;color:var(--muted);font-weight:600}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}.l{color:var(--muted);font-size:13px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:92px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--accent)}
.zone{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.zone a{color:var(--ink)}
form{display:flex;gap:8px;margin-top:14px}
input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font-size:16px}
button{height:46px;border-radius:12px;border:0;background:var(--accent);color:#1A1205;font-weight:700;padding:0 16px;font-size:15px}
.err{color:#FF8F94;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>ROUTA · Statistiques</h1>
<div class="muted">Totaux seulement, aucune donnée personnelle. Page privée, non référencée.</div>
<div id="out"></div>
</main>
<script src="config.js"></script>
<script>
(function () {
  var CFG = window.ROUTA_CONFIG || {};
  var out = document.getElementById('out');
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function getKey() { try { return localStorage.getItem('routa.statsKey') || ''; } catch (e) { return ''; } }
  function setKey(k) { try { if (k) localStorage.setItem('routa.statsKey', k); else localStorage.removeItem('routa.statsKey'); } catch (e) { /* */ } }
  function ask(msg) {
    out.innerHTML = '<form id="f"><input id="k" placeholder="Code d\'accès" autocomplete="off" autocapitalize="characters"><button>Voir</button></form>' + (msg ? '<div class="err">' + esc(msg) + '</div>' : '');
    document.getElementById('f').onsubmit = function (e) { e.preventDefault(); var k = document.getElementById('k').value.trim().toUpperCase(); setKey(k); load(); };
  }
  function card(v, l) { return '<div class="card"><div class="v">' + esc(v) + '</div><div class="l">' + esc(l) + '</div></div>'; }
  async function load() {
    var k = getKey(); if (!k) { ask(''); return; }
    out.innerHTML = '<p class="muted">Chargement…</p>';
    try {
      var r = await fetch(CFG.supabaseUrl + '/rest/v1/rpc/routa_stats', { method: 'POST', headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ k: k }) });
      if (r.status === 404) { out.innerHTML = '<p class="err">Les statistiques ne sont pas encore activées dans Supabase.</p>'; return; }
      var d = await r.json();
      if (!d || d.code || d.message) { setKey(''); ask('Code incorrect.'); return; }
      var days = d.par_jour || []; var max = Math.max.apply(null, days.map(function (x) { return x.n; }).concat([1]));
      out.innerHTML =
        '<h2>Conducteurs</h2><div class="grid">' + card(d.profils, 'profils créés') + card(d.actifs_24h, 'actifs ces 24 h') + card(d.actifs_7j, 'actifs sur 7 jours') + card(d.actifs_30j, 'actifs sur 30 jours') + '</div>' +
        '<h2>Dernière activité par jour (14 jours)</h2><div class="card bars">' + (days.length ? days.map(function (x) { return '<div class="bar"><span>' + esc(x.j.slice(5).split('-').reverse().join('.')) + '</span><i style="width:' + Math.max(4, Math.round(x.n / max * 100)) + '%"></i><b>' + esc(x.n) + '</b></div>'; }).join('') : '<span class="muted">Pas encore de données.</span>') + '</div>' +
        '<p class="muted">Chaque conducteur compte le jour de sa dernière ouverture de l\'app.</p>' +
        '<h2>Communauté</h2><div class="grid">' + card(d.spots, 'spots en tout') + card(d.spots_membres, 'spots ajoutés par les membres') + card(d.alertes_7j, 'alertes sur 7 jours') + card(d.convois, 'convois créés') + card(d.messages_7j, 'messages sur 7 jours') + card(d.retours, 'retours de testeurs') + '</div>' +
        '<h2>Zones les plus actives (30 jours)</h2><div class="card">' + ((d.zones || []).length ? d.zones.map(function (z) { return '<div class="zone"><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/#map=9/' + z.lat + '/' + z.lon + '">Autour de ' + esc(z.lat) + '° N, ' + esc(z.lon) + '° E</a><b>' + esc(z.n) + '</b></div>'; }).join('') : '<span class="muted">Pas encore de données.</span>') + '</div>' +
        '<p class="muted">Zones d\'environ 100 km, pour voir dans quelles régions l\'app est utilisée.</p>' +
        '<p><button id="rf">Actualiser</button></p>';
      document.getElementById('rf').onclick = load;
    } catch (e) { out.innerHTML = '<p class="err">Connexion impossible. Réessaie.</p>'; }
  }
  load();
})();
</script>
</body>
</html>
