<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ROUTA · Suivi en direct</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--bg:#0E1116;--card:#171B22;--ink:#F2F4F7;--muted:#9AA3AF;--accent:#FF8A3D}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#map{position:absolute;inset:0}
.box{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:5}
.box b{font-size:17px}.sub{color:var(--muted);font-size:13px;margin-top:2px}
.eta{font-size:26px;font-weight:800;color:var(--accent)}
.brand{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;background:var(--card);border-radius:12px;padding:6px 12px;font-weight:800;letter-spacing:.06em;z-index:5;color:var(--ink);text-decoration:none}
.car{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 6px rgba(255,138,61,.3)}
.dest{width:18px;height:18px;border-radius:5px;background:#3DDC97;border:3px solid #fff}
</style>
</head>
<body>
<div id="map"></div>
<a class="brand" href="./">ROUTA</a>
<div class="box" id="box"><b>Chargement…</b></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const CFG = window.ROUTA_CONFIG || {};
  let LG = 'fr'; try { LG = localStorage.getItem('routa.lang') || ''; } catch (e) { /* */ }
  if (!/^(fr|en|tr|de|it|pt|es|sq|sr)$/.test(LG)) { let n = (navigator.language || 'fr').slice(0, 2).toLowerCase(); if (/^(hr|bs|sh|me)$/.test(n)) n = 'sr'; LG = /^(en|tr|de|it|pt|es|sq|sr)$/.test(n) ? n : 'fr'; }
  document.documentElement.lang = LG;
  const W = {
    fr: { load: 'Chargement…', bad: 'Lien invalide.', end: 'Le partage de position est terminé.', endSub: 'Demande un nouveau lien si besoin.', nopos: 'Position pas encore disponible…', eta: 'arrivée prévue', now: "Position à l'instant", ago: (m) => 'Position il y a ' + m + ' min', until: "partage jusqu'à", lost: 'Connexion perdue…', retry: 'Nouvel essai dans quelques secondes.', loc: 'fr-CH' },
    en: { load: 'Loading…', bad: 'Invalid link.', end: 'Location sharing has ended.', endSub: 'Ask for a new link if needed.', nopos: 'Location not available yet…', eta: 'expected arrival', now: 'Location just now', ago: (m) => 'Location ' + m + ' min ago', until: 'sharing until', lost: 'Connection lost…', retry: 'Retrying in a few seconds.', loc: 'en-GB' },
    tr: { load: 'Yükleniyor…', bad: 'Geçersiz bağlantı.', end: 'Konum paylaşımı sona erdi.', endSub: 'Gerekirse yeni bir bağlantı iste.', nopos: 'Konum henüz yok…', eta: 'tahmini varış', now: 'Konum az önce', ago: (m) => 'Konum ' + m + ' dk önce', until: 'paylaşım bitişi', lost: 'Bağlantı kesildi…', retry: 'Birkaç saniye içinde yeniden denenecek.', loc: 'tr-TR' },
    de: { load: 'Wird geladen…', bad: 'Ungültiger Link.', end: 'Die Standortfreigabe ist beendet.', endSub: 'Frag bei Bedarf nach einem neuen Link.', nopos: 'Standort noch nicht verfügbar…', eta: 'voraussichtliche Ankunft', now: 'Standort gerade eben', ago: (m) => 'Standort vor ' + m + ' Min.', until: 'Freigabe bis', lost: 'Verbindung unterbrochen…', retry: 'Neuer Versuch in wenigen Sekunden.', loc: 'de-CH' },
    it: { load: 'Caricamento…', bad: 'Link non valido.', end: 'La condivisione della posizione è terminata.', endSub: 'Chiedi un nuovo link se necessario.', nopos: 'Posizione non ancora disponibile…', eta: 'arrivo previsto', now: 'Posizione adesso', ago: (m) => 'Posizione ' + m + ' min fa', until: 'condivisione fino alle', lost: 'Connessione persa…', retry: 'Nuovo tentativo tra qualche secondo.', loc: 'it-CH' },
    pt: { load: 'A carregar…', bad: 'Link inválido.', end: 'A partilha de localização terminou.', endSub: 'Pede um novo link se precisares.', nopos: 'Localização ainda não disponível…', eta: 'chegada prevista', now: 'Localização agora mesmo', ago: (m) => 'Localização há ' + m + ' min', until: 'partilha até', lost: 'Ligação perdida…', retry: 'Nova tentativa dentro de segundos.', loc: 'pt-PT' },
    es: { load: 'Cargando…', bad: 'Enlace no válido.', end: 'Se ha terminado de compartir la ubicación.', endSub: 'Pide un nuevo enlace si hace falta.', nopos: 'Ubicación aún no disponible…', eta: 'llegada prevista', now: 'Ubicación ahora mismo', ago: (m) => 'Ubicación hace ' + m + ' min', until: 'compartiendo hasta', lost: 'Conexión perdida…', retry: 'Nuevo intento en unos segundos.', loc: 'es-ES' },
    sq: { load: 'Duke u ngarkuar…', bad: 'Lidhje e pavlefshme.', end: 'Ndarja e vendndodhjes ka përfunduar.', endSub: 'Kërko një lidhje të re nëse duhet.', nopos: 'Vendndodhja nuk është ende e disponueshme…', eta: 'mbërritja e parashikuar', now: 'Vendndodhja tani', ago: (m) => 'Vendndodhja para ' + m + ' min', until: 'ndarje deri në', lost: 'Lidhja u ndërpre…', retry: 'Provë e re pas pak sekondash.', loc: 'sq-AL' },
    sr: { load: 'Učitavanje…', bad: 'Nevažeći link.', end: 'Deljenje lokacije je završeno.', endSub: 'Zatraži novi link ako treba.', nopos: 'Lokacija još nije dostupna…', eta: 'očekivani dolazak', now: 'Lokacija upravo sada', ago: (m) => 'Lokacija pre ' + m + ' min', until: 'deljenje do', lost: 'Veza je prekinuta…', retry: 'Novi pokušaj za nekoliko sekundi.', loc: 'sr-Latn-RS' }
  }[LG];
  const id = new URLSearchParams(location.search).get('id');
  const box = document.getElementById('box');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clock = (d) => d.toLocaleTimeString(W.loc, { hour: '2-digit', minute: '2-digit' });
  if (!id || !CFG.supabaseUrl) { box.innerHTML = '<b>' + W.bad + '</b>'; return; }
  const map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', center: [6.6, 46.5], zoom: 9, attributionControl: { compact: true } });
  let car = null, dest = null, first = true;
  async function tick() {
    try {
      const r = await fetch(CFG.supabaseUrl + '/rest/v1/drivers?id=eq.' + encodeURIComponent(id) + '&select=pseudo,car,lat,lon,speed,updated_at,share_until,nav_name,nav_lat,nav_lon,nav_eta', { headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey } });
      const d = (await r.json())[0];
      if (!d || !d.share_until || Date.parse(d.share_until) < Date.now()) { box.innerHTML = '<b>' + W.end + '</b><div class="sub">' + W.endSub + '</div>'; if (car) { car.remove(); car = null; } return; }
      if (d.lat == null) { box.innerHTML = '<b>' + esc(d.pseudo) + '</b><div class="sub">' + W.nopos + '</div>'; return; }
      if (!car) car = new maplibregl.Marker({ element: Object.assign(document.createElement('div'), { className: 'car' }) }).setLngLat([d.lon, d.lat]).addTo(map);
      else car.setLngLat([d.lon, d.lat]);
      if (d.nav_lat != null) {
        if (!dest) dest = new maplibregl.Marker({ element: Object.assign(document.createElement('div'), { className: 'dest' }) }).addTo(map);
        dest.setLngLat([d.nav_lon, d.nav_lat]);
      } else if (dest) { dest.remove(); dest = null; }
      if (first) { first = false; map.jumpTo({ center: [d.lon, d.lat], zoom: 13 }); } else map.easeTo({ center: [d.lon, d.lat], duration: 900 });
      const age = Math.round((Date.now() - Date.parse(d.updated_at)) / 60000);
      box.innerHTML = '<b>' + esc(d.pseudo) + '</b>' + (d.car ? ' <span class="sub">· ' + esc(d.car) + '</span>' : '') +
        (d.nav_eta ? '<div><span class="eta">' + clock(new Date(d.nav_eta)) + '</span> <span class="sub">' + W.eta + ' · ' + esc(d.nav_name || '') + '</span></div>' : '') +
        '<div class="sub">' + (age < 1 ? W.now : W.ago(age)) + (d.speed ? ' · ' + d.speed + ' km/h' : '') + ' · ' + W.until + ' ' + clock(new Date(d.share_until)) + '</div>';
    } catch (e) { box.innerHTML = '<b>' + W.lost + '</b><div class="sub">' + W.retry + '</div>'; }
  }
  box.innerHTML = '<b>' + W.load + '</b>';
  map.on('load', () => { tick(); setInterval(tick, 8000); });
})();
</script>
</body>
</html>
